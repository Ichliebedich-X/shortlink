# 一键启动：MySQL + Redis + Go 服务
#
#   docker compose up -d --build
#   docker compose ps
#   docker compose logs -f app
#   docker compose down
#
# 注意：
# - MySQL 映射到宿主机 3307，避免和本机已有的 MySQL80（3306）冲突。
# - Redis 映射到宿主机 6380，避免和本机已有的 Redis（6379）冲突。
# - 容器内的 Go 服务用服务名访问：mysql:3306 / redis:6379，不能用 127.0.0.1。

services:
  mysql:
    image: mysql:8.0
    container_name: shortlink-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?create .env from .env.example}"
      MYSQL_DATABASE: shortlink
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次创建数据卷时自动执行建表脚本
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: shortlink-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    image: shortlink:local
    container_name: shortlink-app
    restart: unless-stopped
    environment:
      MYSQL_DSN: "${MYSQL_DSN:?create .env from .env.example}"
      REDIS_ADDR: "${REDIS_ADDR:-redis:6379}"
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  mysql_data:
  redis_data:
